        \ db() as conn:\n        conn.execute('UPDATE operations SET state=?, result=?,\
        \ error=? WHERE id=?', (state, json.dumps(result), error, row['id']))\n\n\n\
        def worker():\n    while not STOP.is_set():\n        with db() as conn:\n\
        \            row = conn.execute(\"SELECT * FROM jobs WHERE state='pending'\
        \ ORDER BY created LIMIT 1\").fetchone()\n            if row:\n          \
        \      conn.execute(\"UPDATE jobs SET state='writing' WHERE id=?\", (row[\"\
        id\"],))\n        if row:\n            process_job(row)\n        else:\n \
        \           with db() as conn:\n                operation = conn.execute(\"\
        SELECT * FROM operations WHERE state='pending' ORDER BY created LIMIT 1\"\
        ).fetchone()\n                if operation:\n                    conn.execute(\"\
        UPDATE operations SET state='running' WHERE id=?\", (operation['id'],))\n\
        \            if operation:\n                process_operation(operation)\n\
        \                continue\n            WAKE.wait(1)\n            WAKE.clear()\n\
        \n\n@asynccontextmanager\nasync def lifespan(app):\n    if len(secret(\"ACTION_API_KEY\"\
        )) < 32:\n        raise RuntimeError(\"Set ACTION_API_KEY_FILE to a secret\
        \ containing at least 32 characters\")\n    if not secret(\"CARBONATE_BRIDGE_PASSWORD\"\
        ):\n        raise RuntimeError(\"Configure CARBONATE_BRIDGE_PASSWORD_FILE\
