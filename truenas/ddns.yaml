    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      PUBLIC_URL: https://YOUR_PUBLIC_HOST
      CALENDAR_TIMEZONE: Europe/Helsinki
      DEFAULT_DURATION_MINUTES: '60'
      PROTON_CALENDAR_ID: ''
      ACTION_API_KEY: REPLACE_WITH_A_RANDOM_KEY_OF_AT_LEAST_32_CHARACTERS
      CARBONATE_BRIDGE_PASSWORD_FILE: /data/bridge_password
      CARBONATE_NO_INVITATIONS: '1'
      PROTON_USERNAME: ''
      PROTON_PASSWORD: ''
      PROTON_TWO_FACTOR_CODE: ''
      PROTON_MAILBOX_PASSWORD: ''
      PROTON_LOGIN_ATTEMPT: '1'
    volumes:
    - calendar_data:/data
    ports:
    - 127.0.0.1:8787:8000
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',
        timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    command:
    - python
    - /app/bootstrap.py
    depends_on:
      initialize-storage:
        condition: service_completed_successfully
  initialize-storage:
    image: python:3.14-slim-bookworm
    user: 0:0
    restart: 'no'
    command:
    - python
    - -c
    - import os; os.chown("/data", 10001, 10001); os.chmod("/data", 0o700)
    volumes:
    - calendar_data:/data
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    security_opt:
    - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CALENDAR_DOMAIN: YOUR_PUBLIC_HOST
    ports:
    - 10080:80
    - 10443:443
    volumes:
    - caddy_data:/data
    - caddy_config:/config
    depends_on:
    - calendar
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
volumes:
  calendar_data: {}
  caddy_data: {}
  caddy_config: {}
configs:
  caddyfile:
    content: |
      {$$CALENDAR_DOMAIN} {
          reverse_proxy calendar:8000
      }
