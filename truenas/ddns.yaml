# Self-contained TrueNAS Apps YAML: paste ONE file. No SSH, uploaded source, or prebuilt image required.
# Set environment values under calendar; keep the build/source block intact.
# See truenas/README.md for login, 2FA and connection instructions.
services:
  calendar:
    build:
      context: .
      dockerfile_inline: "# syntax=docker/dockerfile:1\nFROM golang:1.26-bookworm\
        \ AS bridge\nRUN apt-get update && apt-get install -y --no-install-recommends\
        \ git ca-certificates && rm -rf /var/lib/apt/lists/*\nARG CARBONATE_COMMIT=baa9818402e980208ac0041ea6544f3d4683d29d\n\
        WORKDIR /src\nRUN git clone https://github.com/develonrails/carbonate.git\
        \ . && git checkout \"$${CARBONATE_COMMIT}\"\nCOPY <<'CALENDAR_SOURCE' /tmp/carbonate-cli.patch\n\
        --- a/cmd/carbonate/calendars.go\n+++ b/cmd/carbonate/calendars.go\n@@ -56,6\
        \ +56,7 @@\n \t\t}\n \n \t\tfmt.Fprintf(out, \"\\n%s \u2014 %d event(s)\\\
        n\", name, count)\n+\t\tfmt.Fprintf(out, \"  Calendar ID: %s\\n\", cal.ID)\n\
        \ \n \t\tif !*events && !*ics {\n \t\t\tcontinue\n--- a/cmd/carbonate/main.go\n\
        +++ b/cmd/carbonate/main.go\n@@ -57,6 +57,12 @@\n \t\treturn cmdServe(ctx,\
        \ args[1:], out)\n \tcase \"calendars\":\n \t\treturn cmdCalendars(ctx, args[1:],\
        \ out)\n+\tcase \"calendars-json\":\n+\t\treturn cmdCalendarJSON(ctx, args[1:],\
        \ out, false)\n+\tcase \"events-json\":\n+\t\treturn cmdCalendarJSON(ctx,\
        \ args[1:], out, true)\n+\tcase \"delete-occurrence\":\n+\t\treturn cmdDeleteOccurrence(ctx,\
        \ args[1:], out)\n \tcase \"event\":\n \t\treturn cmdEvent(ctx, args[1:],\
        \ out)\n \tcase \"contacts\":\n--- a/internal/calendar/write.go\n+++ b/internal/calendar/write.go\n\
        @@ -361,6 +361,9 @@\n \tfor i := range components {\n \t\tevent := &components[i]\n\
        \ \n+\t\tif event.Props.Get(\"RECURRENCE-ID\") != nil && recurrenceIDOf(event)\
        \ == 0 {\n+\t\t\treturn nil, fmt.Errorf(\"invalid or unsupported RECURRENCE-ID\"\
        )\n+\t\t}\n \t\tif recurrenceIDOf(event) == 0 {\n \t\t\tseries = append(series,\
        \ event)\n \n@@ -701,12 +704,9 @@\n \t\treturn 0\n \t}\n \n-\twhen, err :=\
        \ time.Parse(\"20060102T150405Z\", strings.TrimSpace(prop.Value))\n-\tif err\
        \ != nil {\n-\t\t// Also accept a date-only value, which a full-day series\
        \ uses.\n-\t\tif when, err = time.Parse(\"20060102\", strings.TrimSpace(prop.Value));\
        \ err != nil {\n-\t\t\treturn 0\n-\t\t}\n+\twhen, err := prop.DateTime(time.UTC)\n\
        +\tif err != nil {\n+\t\treturn 0\n \t}\n \n \treturn when.Unix()\n\nCALENDAR_SOURCE\n\
        COPY <<'CALENDAR_SOURCE' /src/cmd/carbonate/calendar_api.go\npackage main\n\
        \nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"errors\"\n\t\"flag\"\n\
        \t\"github.com/develonrails/carbonate/internal/calendar\"\n\t\"io\"\n)\n\n\
        // Machine-readable calendar data for the private adapter. No account/session\n\
        // credentials are included. Targeted UID reads decrypt only the requested\
        \ event.\nfunc cmdCalendarJSON(ctx context.Context, args []string, out io.Writer,\
        \ events bool) error {\n\tfs := flag.NewFlagSet(\"calendar json\", flag.ContinueOnError)\n\
        \tfs.SetOutput(out)\n\tpath := fs.String(\"session\", \"\", \"session file\"\
        )\n\tcalendarID := fs.String(\"calendar\", \"\", \"calendar ID\")\n\tuid :=\
        \ fs.String(\"uid\", \"\", \"only this iCalendar UID\")\n\tif err := fs.Parse(args);\
        \ err != nil {\n\t\treturn err\n\t}\n\tif fs.NArg() != 0 {\n\t\treturn errors.New(\"\
        unexpected positional argument\")\n\t}\n\tconn, err := connect(ctx, *path)\n\
        \tif err != nil {\n\t\treturn err\n\t}\n\tdefer conn.Close()\n\tif !events\
        \ {\n\t\tcalendars, err := calendar.List(ctx, conn)\n\t\tif err != nil {\n\
        \t\t\treturn err\n\t\t}\n\t\treturn json.NewEncoder(out).Encode(calendars)\n\
        \t}\n\tif *calendarID == \"\" {\n\t\treturn errors.New(\"calendar ID is required\"\
        )\n\t}\n\tdecoded, unreadable, err := calendar.EventsForUID(ctx, conn, *calendarID,\
        \ *uid)\n\tif err != nil {\n\t\treturn err\n\t}\n\ttype item struct {\n\t\t\
        UID        string `json:\"uid\"`\n\t\tICS        string `json:\"ics\"`\n\t\
        \tModified   string `json:\"modified\"`\n\t\tUnverified bool   `json:\"unverified\"\
        `\n\t}\n\tresult := struct {\n\t\tCalendarID      string `json:\"calendar_id\"\
        `\n\t\tEvents          []item `json:\"events\"`\n\t\tUnreadableCount int \
        \   `json:\"unreadable_count\"`\n\t}{CalendarID: *calendarID, Events: []item{},\
        \ UnreadableCount: len(unreadable)}\n\tfor _, event := range decoded {\n\t\
        \tresult.Events = append(result.Events, item{event.UID, event.ICS(), event.Modified.UTC().Format(\"\
        2006-01-02T15:04:05Z\"), event.Unverified})\n\t}\n\treturn json.NewEncoder(out).Encode(result)\n\
        }\n\nfunc cmdDeleteOccurrence(ctx context.Context, args []string, out io.Writer)\
        \ error {\n\tfs := flag.NewFlagSet(\"delete occurrence\", flag.ContinueOnError)\n\
        \tfs.SetOutput(out)\n\tpath := fs.String(\"session\", \"\", \"session file\"\
        )\n\tcalendarID := fs.String(\"calendar\", \"\", \"calendar ID\")\n\tuid :=\
        \ fs.String(\"uid\", \"\", \"iCalendar UID\")\n\trid := fs.Int64(\"recurrence-id\"\
        , 0, \"original occurrence Unix timestamp\")\n\tif err := fs.Parse(args);\
        \ err != nil {\n\t\treturn err\n\t}\n\tif fs.NArg() != 0 || *calendarID ==\
        \ \"\" || *uid == \"\" || *rid == 0 {\n\t\treturn errors.New(\"calendar, UID\
        \ and nonzero recurrence ID are required\")\n\t}\n\tconn, err := connect(ctx,\
        \ *path)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer conn.Close()\n\t\
        deleted, err := calendar.DeleteOccurrence(ctx, conn, *calendarID, *uid, *rid)\n\
        \tif err != nil {\n\t\treturn err\n\t}\n\treturn json.NewEncoder(out).Encode(map[string]bool{\"\
        deleted\": deleted})\n}\n\nCALENDAR_SOURCE\nCOPY <<'CALENDAR_SOURCE' /src/internal/calendar/query.go\n\
        package calendar\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"github.com/develonrails/carbonate/internal/proton\"\
        \n\t_ \"time/tzdata\" // Resolve recurrence TZIDs even in the slim runtime\
        \ image.\n)\n\n// EventsForUID avoids decrypting an entire account to verify\
        \ one appointment.\n// An empty UID deliberately requests the whole selected\
        \ calendar.\nfunc EventsForUID(ctx context.Context, conn *proton.Conn, calendarID,\
        \ uid string) ([]Event, []string, error) {\n\tkeys, err := conn.CalendarKeys(ctx,\
        \ calendarID)\n\tif err != nil {\n\t\treturn nil, nil, err\n\t}\n\traw, err\
        \ := fetchAll(ctx, conn, calendarID)\n\tif err != nil {\n\t\treturn nil, nil,\
        \ err\n\t}\n\tif uid != \"\" {\n\t\tselected := raw[:0]\n\t\tfor _, event\
        \ := range raw {\n\t\t\tif event.UID == uid {\n\t\t\t\tselected = append(selected,\
        \ event)\n\t\t\t}\n\t\t}\n\t\traw = selected\n\t}\n\tevents, unreadable :=\
        \ decodeAll(raw, keys.CalKR, keys.AddrKR)\n\treturn events, unreadable, nil\n\
        }\n\n// DeleteOccurrence removes only a matching exception row, never its\
        \ master.\nfunc DeleteOccurrence(ctx context.Context, conn *proton.Conn, calendarID,\
        \ uid string, recurrenceID int64) (bool, error) {\n\tif recurrenceID == 0\
        \ {\n\t\treturn false, errors.New(\"refusing to delete a master as an occurrence\"\
        )\n\t}\n\tkeys, err := conn.CalendarKeys(ctx, calendarID)\n\tif err != nil\
        \ {\n\t\treturn false, err\n\t}\n\tevent, err := findEvent(ctx, conn, calendarID,\
        \ uid, recurrenceID)\n\tif err != nil || event == nil {\n\t\treturn false,\
        \ err\n\t}\n\t_, err = sync(ctx, conn, calendarID, keys.MemberID, deleteEntry{ID:\
        \ event.ID}, false)\n\treturn err == nil, err\n}\n\nCALENDAR_SOURCE\nRUN git\
        \ apply /tmp/carbonate-cli.patch\nRUN CGO_ENABLED=0 go build -trimpath -o\
        \ /out/carbonate ./cmd/carbonate\n\nFROM python:3.14-slim-bookworm\nRUN groupadd\
        \ -g 10001 calendar && useradd -u 10001 -g calendar -M calendar && mkdir /data\
        \ /app && chown calendar:calendar /data\nCOPY --from=bridge /out/carbonate\
        \ /usr/local/bin/carbonate\nWORKDIR /app\nCOPY <<'CALENDAR_SOURCE' /app/requirements.txt\n\
        fastapi==0.142.2\nuvicorn==0.54.0\nicalendar==7.3.0\nrecurring-ical-events==3.8.2\n\
        \nCALENDAR_SOURCE\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY\
        \ <<'CALENDAR_SOURCE' /app/app.py\n\"\"\"Private GPT Action adapter for the\
        \ experimental Carbonate Proton bridge.\"\"\"\nimport hashlib\nimport hmac\n\
        import json\nimport os\nimport re\nimport sqlite3\nimport subprocess\nimport\
        \ threading\nimport time\nimport uuid\nfrom contextlib import asynccontextmanager\n\
        from datetime import date, datetime, timedelta, timezone\nfrom pathlib import\
        \ Path\nfrom zoneinfo import ZoneInfo\n\nfrom fastapi import Depends, FastAPI,\
        \ HTTPException\nfrom fastapi.security import HTTPAuthorizationCredentials,\
        \ HTTPBearer\nfrom icalendar import Calendar, Event\nfrom pydantic import\
        \ BaseModel, ConfigDict, Field, StrictInt, field_validator, model_validator\n\
        import calendar_operations as operations\n\nDATA = Path(os.getenv(\"DATA_DIR\"\
        , \"/data\"))\nTZ = os.getenv(\"CALENDAR_TIMEZONE\", \"Europe/Helsinki\")\n\
        DEFAULT_DURATION = int(os.getenv(\"DEFAULT_DURATION_MINUTES\", \"60\"))\n\
        CALENDAR_ID = os.getenv(\"PROTON_CALENDAR_ID\", \"\")\nPUBLIC_URL = os.getenv(\"\
        PUBLIC_URL\", \"https://calendar.example.com\").rstrip(\"/\")\nSTOP = threading.Event()\n\
        WAKE = threading.Event()\n\n\ndef secret(name):\n    path = os.getenv(name\
        \ + \"_FILE\")\n    return Path(path).read_text().strip() if path else os.getenv(name,\
        \ \"\")\n\n\ndef db():\n    conn = sqlite3.connect(DATA / \"jobs.sqlite\"\
        , timeout=5)\n    conn.row_factory = sqlite3.Row\n    return conn\n\n\nclass\
        \ EventRequest(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\"\
        )\n    title: str = Field(min_length=1, max_length=200)\n    start: datetime\
        \ | date = Field(description=\"Absolute ISO 8601 date/time with UTC offset.\"\
        )\n    end: datetime | date | None = Field(default=None, description=\"End\
        \ with UTC offset; omit to use the configured default duration.\")\n    calendar_id:\
        \ str | None = Field(default=None, pattern=operations.CALENDAR_PATTERN)\n\
        \    recurrence: operations.Recurrence | None = None\n    recurrence_timezone:\
        \ str | None = None\n    reminders_minutes: list[StrictInt] = Field(default_factory=list,\
        \ max_length=5)\n    location: str = Field(default=\"\", max_length=300)\n\
        \    description: str = Field(default=\"\", max_length=2000)\n\n    @field_validator('start',\
        \ 'end', mode='before')\n    @classmethod\n    def distinguish_dates(cls,\
        \ value):\n        if isinstance(value, str) and re.fullmatch(r'\\d{4}-\\\
        d{2}-\\d{2}', value):\n            return date.fromisoformat(value)\n    \
        \    return value\n\n    @field_validator(\"title\", \"location\", \"description\"\
        )\n    @classmethod\n    def clean_text(cls, value):\n        if any(ord(c)\
        \ < 32 and c not in \"\\n\\t\" for c in value):\n            raise ValueError(\"\
        Control characters are not allowed\")\n        return value.strip()\n\n  \
        \  @model_validator(mode=\"after\")\n    def check_times(self):\n        if\
        \ not self.title:\n            raise ValueError(\"Title must not be blank\"\
        )\n        timed = isinstance(self.start, datetime)\n        if self.end is\
        \ not None and isinstance(self.end, datetime) != timed:\n            raise\
        \ ValueError(\"Start and end must both be dates or both be date-times\")\n\
        \        if timed:\n            if self.start.utcoffset() is None or (self.end\
        \ and self.end.utcoffset() is None):\n                raise ValueError(\"\
        Dates require an explicit UTC offset\")\n            self.start = self.start.astimezone(timezone.utc)\n\
        \            self.end = (self.end or (self.start + timedelta(minutes=DEFAULT_DURATION))).astimezone(timezone.utc)\n\
        \            if self.start.microsecond or self.end.microsecond:\n        \
        \        raise ValueError(\"Use whole seconds\")\n        else:\n        \
        \    self.end = self.end or self.start + timedelta(days=1)\n        if self.end\
        \ <= self.start or self.end - self.start > timedelta(days=7):\n          \
        \  raise ValueError(\"End must follow start and duration must not exceed seven\
        \ days\")\n        if any(type(v) is not int or not 0 <= v <= 10080 for v\
        \ in self.reminders_minutes):\n            raise ValueError(\"Device reminders\
        \ must be zero to 10080 minutes before the event\")\n        self.reminders_minutes\
        \ = sorted(set(self.reminders_minutes))\n        if self.recurrence_timezone:\n\
        \            try:\n                ZoneInfo(self.recurrence_timezone)\n  \
        \          except (KeyError, ValueError, TypeError):\n                raise\
        \ ValueError(\"Use a valid IANA recurrence timezone\")\n        if self.recurrence:\n\
        \            if timed and not self.recurrence_timezone:\n                raise\
        \ ValueError(\"Recurring timed events require an IANA recurrence timezone\"\
        )\n            if self.recurrence.until:\n                if not timed or\
        \ self.recurrence.until < self.start:\n                    raise ValueError(\"\
        until must follow a timed series start; use count for all-day series\")\n\
        \        return self\n\n\ndef identity(event):\n    payload = event.model_dump(mode=\"\
        json\")\n    # Keep existing individual-event request identities stable after\
        \ upgrades.\n    for key in ('calendar_id', 'recurrence', 'recurrence_timezone',\
        \ 'reminders_minutes'):\n        if not payload[key]:\n            del payload[key]\n\
        \    raw = json.dumps(payload, sort_keys=True, separators=(\",\", \":\"))\n\
        \    return hashlib.sha256(raw.encode()).hexdigest(), raw\n\n\ndef make_ics(event,\
        \ uid):\n    cal = Calendar()\n    cal.add(\"prodid\", \"-//Private Proton\
        \ Calendar GPT//EN\")\n    cal.add(\"version\", \"2.0\")\n    item = Event()\n\
        \    item.add(\"uid\", uid)\n    item.add(\"dtstamp\", datetime.now(timezone.utc))\n\
        \    zone = ZoneInfo(event.recurrence_timezone) if event.recurrence and isinstance(event.start,\
        \ datetime) else None\n    item.add(\"dtstart\", event.start.astimezone(zone)\
        \ if zone else event.start)\n    item.add(\"dtend\", event.end.astimezone(zone)\
        \ if zone else event.end)\n    if event.recurrence:\n        item.add(\"rrule\"\
        , operations.rule_value(event.recurrence))\n    operations.reminders(item,\
        \ event.reminders_minutes)\n    item.add(\"summary\", event.title)\n    if\
        \ event.location:\n        item.add(\"location\", event.location)\n    if\
        \ event.description:\n        item.add(\"description\", event.description)\n\
        \    cal.add_component(item)\n    return cal.to_ical()\n\n\nclass BridgeError(Exception):\n\
        \    def __init__(self, message, safe_diagnostic=''):\n        super().__init__(message)\n\
        \        self.safe_diagnostic = safe_diagnostic\n\n\nclass CalendarContext(BaseModel):\n\
        \    now: str\n    timezone: str\n    default_duration_minutes: int\n    provider:\
        \ str\n    login_configured: bool\n    api_version: int = 2\n    adapter_version:\
        \ str = \"0.2.3\"\n    selected_calendar_id: str\n    capabilities: list[str]\n\
        \n\nclass EventStatus(BaseModel):\n    job_id: str\n    state: str = Field(description=\"\
        pending, writing, verified, or unknown. Only verified confirms a saved event.\"\
        )\n    event: dict\n    error: str\n    calendar_url: str\n    poll_after_seconds:\
        \ int\n\n\ndef run_bridge(args, content=None):\n    env = os.environ.copy()\n\
        \    env[\"CARBONATE_BRIDGE_PASSWORD\"] = secret(\"CARBONATE_BRIDGE_PASSWORD\"\
        )\n    env[\"CARBONATE_NO_INVITATIONS\"] = \"1\"\n    try:\n        result\
        \ = subprocess.run(\n            [\"carbonate\", *args, \"-session\", str(DATA\
        \ / \"auth.json\")],\n            input=content, capture_output=True, timeout=90,\
        \ env=env,\n        )\n    except (subprocess.TimeoutExpired, OSError) as\
        \ exc:\n        raise BridgeError(\"Bridge unavailable or timed out\", 'bridge\
        \ unavailable or timed out') from exc\n    if result.returncode:\n       \
        \ # Never send upstream errors, tokens, or account data to the API client.\n\
        \        # Retain only the numeric code in Carbonate's known rejection format.\n\
        \        # Never expose the accompanying upstream text, tokens or calendar\
        \ data.\n        match = re.search(rb'Proton rejected (?:the event|the request)[^\\\
        r\\n]*\\(code ([0-9]{3,6})\\)', result.stderr)\n        diagnostic = 'bridge\
        \ command failed'\n        if match:\n            diagnostic = 'Proton rejected\
        \ the write, code ' + match[1].decode('ascii')\n            lowered = result.stderr.lower()\n\
        \            for category, words in (\n                ('signature', (b'signed',\
        \ b'signature')),\n                ('timezone', (b'tzid', b'timezone', b'time\
        \ zone')),\n                ('recurrence', (b'recurr', b'parent')),\n    \
        \            ('duplicate', (b'already exists', b'duplicate')),\n         \
        \       ('sequence', (b'sequence',)),\n                ('properties', (b'properties',\
        \ b'property')),\n            ):\n                if any(word in lowered for\
        \ word in words):\n                    diagnostic += ', category ' + category\n\
        \                    break\n        raise BridgeError(\"Bridge command failed;\
        \ check login and calendar configuration\", diagnostic)\n    return result.stdout.decode(\"\
        utf-8\", errors=\"strict\")\n\n\ndef verified_in_output(output, event, uid):\n\
        \    # Carbonate's calendars --ics indents each iCalendar line with '    |\
        \ '.\n    lines = [line[6:] for line in output.splitlines() if line.startswith(\"\
        \    | \")]\n    text = \"\\r\\n\".join(lines) + \"\\r\\n\"\n    # Each event\
        \ is a separate VCALENDAR; parse independently.\n    blocks = re.findall(r\"\
        BEGIN:VCALENDAR\\r\\n.*?END:VCALENDAR\", text, re.S)\n    for block in blocks:\n\
        \        for item in Calendar.from_ical(block).walk(\"VEVENT\"):\n       \
        \     if str(item.get(\"UID\", \"\")) != uid:\n                continue\n\
        \            return (\n                str(item.get(\"SUMMARY\", \"\")) ==\
        \ event.title\n                and item.decoded(\"DTSTART\") == event.start\n\
        \                and item.decoded(\"DTEND\") == event.end\n              \
        \  and str(item.get(\"LOCATION\", \"\")) == event.location\n             \
        \   and str(item.get(\"DESCRIPTION\", \"\")) == event.description\n      \
        \      )\n    return False\n\n\ndef update_job(job_id, state, error=\"\"):\n\
        \    with db() as conn:\n        conn.execute(\"UPDATE jobs SET state=?, error=?\
        \ WHERE id=?\", (state, error, job_id))\n\n\ndef creation_calendar(event):\n\
        \    selected = event.calendar_id or CALENDAR_ID\n    if not selected:\n \
        \       calendars = json.loads(run_bridge(['calendars-json']))\n        if\
        \ len(calendars) != 1:\n            raise operations.OperationError('Select\
        \ a calendar ID; this account has multiple calendars')\n        selected =\
        \ calendars[0]['ID']\n    return selected\n\n\ndef verify_creation(event,\
        \ uid, selected):\n    data = operations.snapshot(run_bridge, selected, uid)\n\
        \    expected = Calendar.from_ical(make_ics(event, uid)).walk('VEVENT')[0]\n\
        \    items = operations.calendar_from_snapshot(data).walk('VEVENT')\n    return\
        \ not data['unreadable_count'] and any(\n        not i.get('RECURRENCE-ID')\
        \ and operations.verification_signature(i) == operations.verification_signature(expected)\n\
        \        for i in items\n    )\n\n\ndef process_job(row):\n    event = EventRequest.model_validate_json(row['payload'])\n\
        \    uid = row['id'] + '@private-proton-gpt'\n    try:\n        selected =\
        \ creation_calendar(event)\n        run_bridge(['event', 'put', '-calendar',\
        \ selected], make_ics(event, uid))\n        if not verify_creation(event,\
        \ uid, selected):\n            raise BridgeError('Write was not verified')\n\
        \    except Exception:\n        update_job(row['id'], 'unknown', 'Could not\
        \ verify the write. Check Proton Calendar before trying again; the event may\
        \ already exist.')\n    else:\n        update_job(row['id'], 'verified')\n\
        \n\ndef process_operation(row):\n    payload = json.loads(row['payload'])\n\
        \    try:\n        if payload.get('kind') == 'verify_creation':\n        \
        \    with db() as conn:\n                job = conn.execute('SELECT * FROM\
        \ jobs WHERE id=?', (payload['job_id'],)).fetchone()\n            event =\
        \ EventRequest.model_validate_json(job['payload'])\n            verified =\
        \ verify_creation(event, job['id'] + '@private-proton-gpt', creation_calendar(event))\n\
        \            if verified:\n                update_job(job['id'], 'verified')\n\
        \            result = {'verified': verified, 'job_id': job['id'], 'message':\
        \ 'Read-only reconciliation; no event was written or retried.'}\n        else:\n\
        \            result = operations.execute(operations.CalendarOperation.model_validate(payload),\
        \ run_bridge, CALENDAR_ID)\n        state, error = 'ready', ''\n    except\
        \ operations.MutationUncertain as exc:\n        result, state, error = {},\
        \ 'unknown', str(exc)\n    except operations.OperationError as exc:\n    \
        \    result, state, error = {}, 'failed', str(exc)\n    except Exception:\n\
        \        result, state, error = {}, 'failed', 'Calendar operation failed before\
