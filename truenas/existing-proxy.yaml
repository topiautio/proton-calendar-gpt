# Self-contained TrueNAS Apps YAML: paste ONE file. No SSH, uploaded source, or prebuilt image required.
# Set environment values under calendar; keep the build/source block intact.
# See truenas/README.md for login, 2FA and connection instructions.
services:
  calendar:
    build:
      context: .
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM golang:1.26-bookworm AS bridge
        RUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
        ARG CARBONATE_COMMIT=baa9818402e980208ac0041ea6544f3d4683d29d
        WORKDIR /src
        RUN git clone https://github.com/develonrails/carbonate.git . && git checkout "$${CARBONATE_COMMIT}"
        RUN printf '%s' '' | base64 -d | gzip -d > /tmp/carbonate-cli.patch
        RUN printf '%s' '' | base64 -d | gzip -d > /src/cmd/carbonate/calendar_api.go
        RUN printf '%s' '' | base64 -d | gzip -d > /src/internal/calendar/query.go
        RUN git apply /tmp/carbonate-cli.patch
        RUN CGO_ENABLED=0 go build -trimpath -o /out/carbonate ./cmd/carbonate

        FROM python:3.14-slim-bookworm
        RUN groupadd -g 10001 calendar && useradd -u 10001 -g calendar -M calendar && mkdir /data /app && chown calendar:calendar /data
        COPY --from=bridge /out/carbonate /usr/local/bin/carbonate
        WORKDIR /app
        RUN printf '%s' 'H4sIAAAAAAAC/xXJSQ6AIAwAwDt/oUHA6KWPabCaJqaasrxfuc6cVBu9ghhgyRGi60PKYzphzRCcFLpZDzLEDdIPxqWbiV5+lufB2ipigh2i+wDQEtbGTwAAAA==' | base64 -d | gzip -d > /app/requirements.txt
        RUN pip install --no-cache-dir -r requirements.txt
        RUN printf '%s' '' | base64 -d | gzip -d > /app/app.py
        RUN printf '%s' '' | base64 -d | gzip -d > /app/calendar_operations.py
        RUN printf '%s' '' | base64 -d | gzip -d > /app/claude_connector.py
        RUN printf '%s' 'H4sIAAAAAAAC/1NW1E/KzNMvzuAqTi1R0E0t5SrNTSzOVjAwN+fKTFOIVtBNU9AvKgWqSE0uSi0p1k8qykxJT40vSCwuLs8vSlGItVYoyUjN41IAAmfHICd/P8cQ13inIE8Xd9f4AMfg4HD/IBdbFY3kxBK8BmmCTUitKMgvKsFtEFdaJldqRWqygpKKgxIXAF348ce9AAAA' | base64 -d | gzip -d > /app/entrypoint.sh
        RUN printf '%s' '' | base64 -d | gzip -d > /app/bootstrap.py
        RUN chmod 755 /app/entrypoint.sh
        USER 10001:10001
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        EXPOSE 8000
        ENTRYPOINT ["/app/entrypoint.sh"]
        CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      PUBLIC_URL: https://YOUR_PUBLIC_HOST
      CALENDAR_TIMEZONE: Europe/Helsinki
      DEFAULT_DURATION_MINUTES: '60'
      PROTON_CALENDAR_ID: ''
      ACTION_API_KEY: REPLACE_WITH_A_RANDOM_KEY_OF_AT_LEAST_32_CHARACTERS
      CARBONATE_BRIDGE_PASSWORD_FILE: /data/bridge_password
      CARBONATE_NO_INVITATIONS: '1'
      PROTON_USERNAME: ''
      PROTON_PASSWORD: ''
      PROTON_TWO_FACTOR_CODE: ''
      PROTON_MAILBOX_PASSWORD: ''
      PROTON_LOGIN_ATTEMPT: '1'
    volumes:
    - calendar_data:/data
    ports:
    - 127.0.0.1:8787:8000
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',
        timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    command:
    - python
    - /app/bootstrap.py
    depends_on:
      initialize-storage:
        condition: service_completed_successfully
  initialize-storage:
    image: python:3.14-slim-bookworm
    user: 0:0
    restart: 'no'
    command:
    - python
    - -c
    - import os; os.chown("/data", 10001, 10001); os.chmod("/data", 0o700)
    volumes:
    - calendar_data:/data
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - FOWNER
    security_opt:
    - no-new-privileges:true
volumes:
  calendar_data: {}
