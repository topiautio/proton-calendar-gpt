# Run together with compose.yaml. Requires inbound TCP 80 and 443 to this proxy.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CALENDAR_DOMAIN: ${CALENDAR_DOMAIN:?Set CALENDAR_DOMAIN to your DDNS hostname}
    ports:
      - "10080:80"
      - "10443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [calendar]
volumes:
  caddy_data:
  caddy_config:
